<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Новогодний плеер</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="player-page">

  <div class="bg bg-dark"></div>
  <div class="snow-container" id="snow"></div>

  <a href="index.html" class="back-btn">← Назад</a>

  <div class="player-wrap">
    <h1>🎵 Новогодний плеер</h1>

    <div class="player-vinyl">
      <img src="assets/images/dancing-cat.gif" alt="Танцующий котик" class="dancing-cat" id="dancingCat">
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Выбери песню</div>
      <div class="track-artist" id="trackArtist">—</div>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#d4af37">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>
      <button class="ctrl-btn play-btn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24" width="32" height="32" fill="#d4af37">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#d4af37">
          <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
        </svg>
      </button>
    </div>

    <div class="volume-control">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="#d4af37">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
      </svg>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7">
    </div>

    <div class="playlist" id="playlist"></div>
  </div>

  <script src="js/snow.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
