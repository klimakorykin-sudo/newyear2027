<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Собери фигуру</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="puzzle-page">

  <div class="bg bg-dark"></div>
  <div class="snow-container" id="snow"></div>

  <a href="index.html" class="back-btn">← Назад</a>

  <div class="puzzle-wrap">
    <h1 id="puzzleTitle">🧩 Собери ёлку</h1>
    <p class="puzzle-sub">Перетащи части на свои места</p>

    <div class="puzzle-selector">
      <button class="puzzle-btn active" data-type="tree" onclick="selectPuzzle('tree', this)">🎄 Ёлка</button>
      <button class="puzzle-btn" data-type="snowman" onclick="selectPuzzle('snowman', this)">⛄ Снеговик</button>
    </div>

    <div class="puzzle-board" id="puzzleBoard">
      <!-- Слоты для ЁЛКИ -->
      <div class="slot invisible" data-slot="star" style="top: 10px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px;"></div>
      <div class="slot invisible" data-slot="top" style="top: 60px; left: 50%; transform: translateX(-50%); width: 80px; height: 60px;"></div>
      <div class="slot invisible" data-slot="mid" style="top: 118px; left: 50%; transform: translateX(-50%); width: 110px; height: 70px;"></div>
      <div class="slot invisible" data-slot="bot" style="top: 186px; left: 50%; transform: translateX(-50%); width: 140px; height: 80px;"></div>
      <div class="slot invisible" data-slot="trunk" style="top: 264px; left: 50%; transform: translateX(-50%); width: 40px; height: 50px;"></div>

      <!-- Слоты для СНЕГОВИКА -->
      <div class="slot invisible snowman-slot" data-slot="bucket" style="top: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 30px; display: none;"></div>
      <div class="slot invisible snowman-slot" data-slot="head" style="top: 50px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; display: none;"></div>
      <div class="slot invisible snowman-slot" data-slot="scarf" style="top: 115px; left: 50%; transform: translateX(-50%); width: 80px; height: 20px; display: none;"></div>
      <div class="slot invisible snowman-slot" data-slot="body1" style="top: 140px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; display: none;"></div>
      <div class="slot invisible snowman-slot" data-slot="body2" style="top: 235px; left: 50%; transform: translateX(-50%); width: 130px; height: 130px; display: none;"></div>
    </div>

    <div class="puzzle-parts" id="puzzleParts">
      <!-- Части ЁЛКИ -->
      <div class="part tree-part" draggable="true" data-part="star">
        <svg viewBox="0 0 60 60" width="50" height="50">
          <polygon points="30,5 37,23 56,23 41,35 47,54 30,42 13,54 19,35 4,23 23,23"
                   fill="#d4af37" stroke="#ffd700" stroke-width="1"/>
        </svg>
      </div>
      <div class="part tree-part" draggable="true" data-part="top">
        <svg viewBox="0 0 80 60" width="80" height="60">
          <polygon points="40,0 80,60 0,60" fill="#15c015" stroke="#d4af37" stroke-width="2"/>
        </svg>
      </div>
      <div class="part tree-part" draggable="true" data-part="mid">
        <svg viewBox="0 0 110 70" width="110" height="70">
          <polygon points="55,0 110,70 0,70" fill="#10a010" stroke="#d4af37" stroke-width="2"/>
        </svg>
      </div>
      <div class="part tree-part" draggable="true" data-part="bot">
        <svg viewBox="0 0 140 80" width="140" height="80">
          <polygon points="70,0 140,80 0,80" fill="#0a5f0a" stroke="#d4af37" stroke-width="2"/>
        </svg>
      </div>
      <div class="part tree-part" draggable="true" data-part="trunk">
        <svg viewBox="0 0 40 50" width="40" height="50">
          <rect x="10" y="0" width="20" height="50" fill="#5c3a1a" stroke="#d4af37" stroke-width="2"/>
        </svg>
      </div>

      <!-- Части СНЕГОВИКА -->
      <div class="part snowman-part" draggable="true" data-part="bucket" style="display:none;">
        <svg viewBox="0 0 60 30" width="60" height="30">
          <polygon points="10,0 50,0 55,25 5,25" fill="#888" stroke="#444" stroke-width="2"/>
        </svg>
      </div>
      <div class="part snowman-part" draggable="true" data-part="head" style="display:none;">
        <svg viewBox="0 0 60 60" width="60" height="60">
          <circle cx="30" cy="30" r="28" fill="#fff" stroke="#ccc" stroke-width="2"/>
          <circle cx="22" cy="25" r="3" fill="#000"/>
          <circle cx="38" cy="25" r="3" fill="#000"/>
          <polygon points="30,32 42,34 30,36" fill="#ff6600"/>
        </svg>
      </div>
      <div class="part snowman-part" draggable="true" data-part="scarf" style="display:none;">
        <svg viewBox="0 0 80 20" width="80" height="20">
          <rect x="5" y="5" width="70" height="12" fill="#c02020" rx="3"/>
          <rect x="55" y="15" width="15" height="5" fill="#a01818"/>
        </svg>
      </div>
      <div class="part snowman-part" draggable="true" data-part="body1" style="display:none;">
        <svg viewBox="0 0 90 90" width="90" height="90">
          <circle cx="45" cy="45" r="42" fill="#fff" stroke="#ccc" stroke-width="2"/>
          <circle cx="45" cy="30" r="4" fill="#333"/>
          <circle cx="45" cy="50" r="4" fill="#333"/>
          <line x1="10" y1="45" x2="-10" y2="35" stroke="#5c3a1a" stroke-width="4"/>
          <line x1="80" y1="45" x2="100" y2="35" stroke="#5c3a1a" stroke-width="4"/>
        </svg>
      </div>
      <div class="part snowman-part" draggable="true" data-part="body2" style="display:none;">
        <svg viewBox="0 0 130 130" width="130" height="130">
          <circle cx="65" cy="65" r="62" fill="#fff" stroke="#ccc" stroke-width="2"/>
          <circle cx="65" cy="40" r="5" fill="#333"/>
          <circle cx="65" cy="65" r="5" fill="#333"/>
          <circle cx="65" cy="90" r="5" fill="#333"/>
        </svg>
      </div>
    </div>

    <div class="puzzle-done" id="puzzleDone" style="display:none;">
      🎉 Собрано! 🎉
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
  <script src="js/snow.js"></script>
  <script src="js/puzzle.js"></script>
</body>
</html>
