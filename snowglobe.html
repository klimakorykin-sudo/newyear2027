<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔮 Снежный шар</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="globe-page">

  <div class="bg bg-dark"></div>

  <a href="index.html" class="back-btn">← Назад</a>

  <div class="globe-wrap">
    <h1>🔮 Снежный шар</h1>
    <p class="globe-sub">Тряси мышкой — снег взлетает</p>

    <div class="globe" id="globe">
      <svg class="globe-svg" viewBox="0 0 400 500">
        <!-- Подставка -->
        <ellipse cx="200" cy="440" rx="130" ry="20" fill="#3a2a1a"/>
        <path d="M 100 420 Q 100 450 200 450 Q 300 450 300 420 L 280 420 Q 280 435 200 435 Q 120 435 120 420 Z" fill="#5c3a1a"/>
        <rect x="120" y="400" width="160" height="25" fill="#5c3a1a" stroke="#d4af37" stroke-width="2"/>

        <!-- Стеклянный шар -->
        <circle cx="200" cy="230" r="170" fill="url(#globeGradient)" stroke="#d4af37" stroke-width="3"/>

        <!-- Внутренний фон -->
        <circle cx="200" cy="230" r="165" fill="#0a1a3a" opacity="0.6"/>

        <!-- Ёлка -->
        <polygon points="200,150 240,220 160,220" fill="#0d7a0d"/>
        <polygon points="200,190 250,260 150,260" fill="#0a5f0a"/>
        <polygon points="200,230 260,310 140,310" fill="#084a08"/>
        <rect x="192" y="310" width="16" height="25" fill="#5c3a1a"/>
        <polygon points="200,130 208,148 192,148" fill="#d4af37"/>

        <!-- Домик -->
        <rect x="120" y="330" width="50" height="40" fill="#8b3a3a"/>
        <polygon points="145,310 95,330 195,330" fill="#a02020"/>
        <rect x="140" y="350" width="12" height="20" fill="#d4af37"/>

        <!-- Снеговик -->
        <circle cx="280" cy="360" r="14" fill="#fff"/>
        <circle cx="280" cy="340" r="11" fill="#fff"/>
        <circle cx="280" cy="325" r="8" fill="#fff"/>

        <!-- Блик -->
        <ellipse cx="140" cy="140" rx="40" ry="60" fill="#fff" opacity="0.15"/>

        <defs>
          <radialGradient id="globeGradient" cx="40%" cy="30%">
            <stop offset="0%" stop-color="#4a6fa5" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#0a1a3a" stop-opacity="0.4"/>
          </radialGradient>
        </defs>
      </svg>

      <canvas id="snowCanvas" class="snow-canvas"></canvas>
    </div>
  </div>

  <script src="js/snowglobe.js"></script>
</body>
</html>
